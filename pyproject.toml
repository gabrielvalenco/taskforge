[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "taskforge"
version = "0.1.0"
description = "Plataforma multi-cloud de orquestração de jobs: filas AWS/Azure/Redis, Celery, threads e processos"
readme = "README.md"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.6"]

[project.optional-dependencies]
redis = ["redis>=5.0"]
celery = ["celery>=5.4", "redis>=5.0"]
aws = ["boto3>=1.34"]
azure = ["azure-servicebus>=7.12"]
all = ["redis>=5.0", "celery>=5.4", "boto3>=1.34", "azure-servicebus>=7.12"]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "fakeredis>=2.23",
    "ruff>=0.17.2",
    "mypy>=1.11",
    "redis>=5.0",
    "celery>=5.4",
    "boto3>=1.34",
    "azure-servicebus>=7.12",
]

[project.scripts]
taskforge = "taskforge.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
taskforge = ["py.typed"]

[tool.pytest.ini_options]
pythonpath = ["src", "tests"]
testpaths = ["tests"]
addopts = "-ra --strict-markers"
markers = ["slow: testes que criam processos filhos (spawn)"]

[tool.coverage.run]
source = ["src/taskforge"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "C4", "RUF", "PT", "S", "BLE"]
ignore = [
    "RUF001", "RUF002", "RUF003",  # acentos em strings/comentários são intencionais (pt-BR)
    "S101",                        # assert é normal em testes
]

[tool.ruff.lint.per-file-ignores]
# Em testes: asserts compostos e `with` aninhados deixam a intenção mais legível.
"tests/*" = ["S", "BLE", "B017", "PT011", "PT018", "PT012", "SIM117"]
"src/taskforge/handlers/builtin.py" = ["S310"]
"src/taskforge/adapters/queues/_errors.py" = ["BLE001"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["src"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["celery.*", "billiard.*", "kombu.*", "redis.*", "boto3.*", "botocore.*", "azure.*"]
ignore_missing_imports = true
